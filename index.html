<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GX SMART TRANSLATOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', 'Inter', sans-serif; background: #050507; color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .main-card { background: #111114; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 28px; width: 100%; max-width: 550px; }
        .input-style { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); transition: 0.3s; }
        .scroll-box { height: 160px; overflow-y: auto; scrollbar-width: none; }
        .scroll-box::-webkit-scrollbar { display: none; }
        #statusLabel { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="main-card p-6 md:p-8 shadow-2xl">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent uppercase">GX PRO</h1>
            <div id="statusLabel" class="text-[10px] font-bold text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full uppercase tracking-tighter">API Connected</div>
        </header>

        <div class="mb-6 relative">
            <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-2">Smart Translation / Dictionary</div>
            <div class="input-style rounded-2xl relative shadow-inner">
                <div id="outputBox" class="scroll-box p-5 text-xl font-semibold leading-relaxed break-words text-indigo-300 pr-16 whitespace-pre-line">...</div>
                <button onclick="copyResult()" id="copyBtn" class="absolute bottom-4 right-4 bg-indigo-600 hover:bg-indigo-500 text-white text-[9px] font-bold px-3 py-2 rounded-xl transition-all active:scale-90">COPY</button>
            </div>
        </div>

        <div class="relative">
            <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-2">Type Anything (BN/EN)</div>
            <div class="input-style rounded-2xl overflow-hidden focus-within:border-indigo-500/50">
                <textarea id="userInput" oninput="autoTranslate()" placeholder="এখানে লিখুন বা পেস্ট করুন..." 
                    class="w-full h-[160px] bg-transparent p-5 text-lg outline-none resize-none text-slate-300 placeholder:text-slate-700"></textarea>
            </div>
        </div>

        <footer class="mt-8 flex justify-between items-center text-[8px] text-slate-600 font-bold uppercase tracking-[0.3em]">
            <span>Deep Neural Engine v4.0</span>
            <span>&copy; 2026 GX STUDIO</span>
        </footer>
    </div>

    <script>
        let typingTimer;
        const doneTypingInterval = 300; // টাইপ করা থামানোর ৩০০ মিলি-সেকেন্ড পর API কল হবে

        function autoTranslate() {
            clearTimeout(typingTimer);
            const input = document.getElementById('userInput').value.trim();
            const output = document.getElementById('outputBox');

            if (!input) {
                output.innerText = "...";
                return;
            }

            // টাইপ করার সময় সাথে সাথে "Translating..." দেখাবে
            output.classList.add('opacity-50');
            
            typingTimer = setTimeout(async () => {
                // ইনপুট ভাষা শনাক্ত করা (বাংলা নাকি ইংরেজি)
                const isBangla = /[\u0980-\u09FF]/.test(input);
                const targetLang = isBangla ? 'en' : 'bn';

                try {
                    // Google Translate API (Free)
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&dt=at&q=${encodeURIComponent(input)}`;
                    
                    const res = await fetch(url);
                    const data = await res.json();

                    if (data && data[0]) {
                        let translatedText = data[0].map(item => item[0]).join("");
                        
                        // ডিকশনারি রেজাল্ট (যদি অল্টারনেটিভ মিনিং থাকে)
                        if (data[1] && data[1][0] && data[1][0][1]) {
                            const synonyms = data[1][0][1].slice(0, 5).join(", ");
                            output.innerHTML = `<span class="text-white">${translatedText}</span><br><br><span class="text-sm text-slate-500 font-normal italic">Synonyms: ${synonyms}</span>`;
                        } else {
                            output.innerText = translatedText;
                        }
                    }
                } catch (e) {
                    output.innerText = "Error fetching data...";
                } finally {
                    output.classList.remove('opacity-50');
                }
            }, doneTypingInterval);
        }

        function copyResult() {
            const text = document.getElementById('outputBox').innerText;
            if (text === "..." || text === "") return;
            navigator.clipboard.writeText(text);
            const btn = document.getElementById('copyBtn');
            btn.innerText = "COPIED!";
            setTimeout(() => { btn.innerText = "COPY"; }, 1500);
        }
    </script>
</body>
</html>
